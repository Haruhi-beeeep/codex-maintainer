[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-maintainer"
version = "0.2.0"
description = "AI-powered toolkit for OSS maintainers using OpenAI Codex"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Haruhi Abe", email = "haruhi.abe.247@baycurrent.co.jp" }
]
keywords = ["openai", "codex", "oss", "automation", "ai", "maintainer", "github", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "openai>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
codex-maintainer = "codex_maintainer.cli:app"

[project.urls]
Homepage = "https://github.com/Haruhi-beeeep/codex-maintainer"
Repository = "https://github.com/Haruhi-beeeep/codex-maintainer"
Issues = "https://github.com/Haruhi-beeeep/codex-maintainer/issues"
Changelog = "https://github.com/Haruhi-beeeep/codex-maintainer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_maintainer"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
